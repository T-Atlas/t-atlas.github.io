{% include language-context.html %}
{% if alternate_page %}
<div class="language-switcher">
  <a href="{{ alternate_page.url | relative_url }}" hreflang="{{ alternate_lang }}" lang="{{ alternate_lang }}" class="language-switcher__btn" aria-label="{% if page_lang == 'zh' %}Switch to English{% else %}切换到中文{% endif %}">
    <span class="language-switcher__icon" aria-hidden="true">🌐</span>
    <span class="language-switcher__text-wrapper">
      <span class="language-switcher__current">{% if page_lang == 'zh' %}中{% else %}EN{% endif %}</span>
      <span class="language-switcher__next">{% if page_lang == 'zh' %}EN{% else %}中{% endif %}</span>
    </span>
  </a>
</div>
{% endif %}
