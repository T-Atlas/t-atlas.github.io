<li class="cv-item">
  <h3 class="archive__item-title" itemprop="headline">
    <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
  </h3>
  {% if post.citation %}<p class="archive__item-excerpt">{{ post.citation }}</p>{% elsif post.venue %}<p>{{ post.venue }}</p>{% endif %}
</li>
